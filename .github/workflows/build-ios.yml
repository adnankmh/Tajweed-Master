name: Build iOS No-Codesign

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  build_ios:
    name: Build iOS No-Codesign Archive
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure iOS platform files
        run: flutter create --platforms=ios .

      - name: Build iOS release without codesign
        run: flutter build ios --release --no-codesign

      - name: Compress iOS build
        run: |
          cd build/ios/iphoneos
          zip -r ../../../tajweed-master-ios-no-codesign.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajweed-master-ios-no-codesign
          if-no-files-found: error
          retention-days: 14
          path: build/tajweed-master-ios-no-codesign.zip
